name: Feature request
description: Suggest a capability, a unit, or a usability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Two constraints worth knowing up front:

        - **Scope is Bangladesh conventions** for a single-page, no-backend calculator. Support for
          another region's standards needs a discussion before code.
        - **No accounts, ads, trackers or server-side storage** — those are deliberate product
          decisions, not gaps.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first — the solution is easier to judge with the context.
      placeholder: I am trying to ... but the tool currently ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      placeholder: A clear description of the behaviour you have in mind.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Conversion engine / unit factors
        - Converter card (result, copy, swap, quick conversions)
        - All-units grid
        - Bengali / English interface
        - Accessibility
        - Performance / offline
        - SEO / metadata
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including other sites — what do they do better or worse?
    validations:
      required: false

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
        - label: I have read the scope notes above (Bangladesh conventions, no backend/accounts/ads).
          required: true
        - label: I am willing to help test this if it is built.
          required: false
