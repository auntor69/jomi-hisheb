# Issue templates.
# Public issues are intentional here: bug reports, accuracy reports and feature
# requests all have a form. Security problems must not be filed as issues — the
# contact link below points at private advisory reporting instead.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/auntor69/jomi-hisheb/security/advisories/new
    about: Please report vulnerabilities privately and never in a public issue (see SECURITY.md).
  - name: Read the contributing guide first
    url: https://github.com/auntor69/jomi-hisheb/blob/main/CONTRIBUTING.md
    about: Ground rules, how to run the project locally, and the pull request checklist.
