name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the build only reads the repository (OSS hardening).
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
