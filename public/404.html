<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>৪০৪ — জমির হিসাব</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f4;
        color: #1c2321;
        font-family: "Noto Sans Bengali", "Noto Sans", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        border: 1px solid #e4e1d6;
        border-radius: 12px;
        background: #fff;
        padding: 40px 32px;
        max-width: 360px;
      }
      h1 { font-size: 40px; margin: 0 0 8px; color: #2b4c9b; }
      p { font-size: 14px; color: #5d5d5a; margin: 0 0 20px; line-height: 1.6; }
      a {
        display: inline-block;
        background: #2b4c9b;
        color: #f7f5ef;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>৪০৪</h1>
      <p>পৃষ্ঠাটি খুঁজে পাওয়া যায়নি।<br />Page not found.</p>
      <a href="/">জমির হিসাব — হোম</a>
    </div>
  </body>
